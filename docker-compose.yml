version: '3.8'

services:
  itam-backend:
    build: ./backend
    container_name: itam-backend-container
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src/models/data.json:/usr/src/app/src/models/data.json
    environment:
      - PORT=5000
      - NODE_ENV=development
    restart: unless-stopped

  itam-frontend:
    build: ./frontend
    container_name: itam-frontend-container
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://itam-backend:5000
    depends_on:
      - itam-backend
    restart: unless-stopped
